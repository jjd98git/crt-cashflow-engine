[project]
name = "crt-cashflow-engine"
version = "0.0.1"
description = "Intex-adjacent cashflow engine for Freddie Mac STACR CRT transactions"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "types-openpyxl"]
gui = ["streamlit>=1.30", "altair>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fast: quick unit tests, run on every edit via the PostToolUse hook",
    "tieout: PPM tie-out regression tests",
    "gui: headless Streamlit AppTest smoke tests (need the gui extra)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
# 3.12, not 3.11: numpy (a streamlit dependency) ships stubs using the 3.12 `type`
# statement, and mypy parses them via polars' numpy.typing import before any override
# can skip them.  The venv runs 3.13; requires-python is still >= 3.11.
python_version = "3.12"
strict = true
files = ["src/crt"]

# The GUI package imports pandas (pulled in by streamlit) which ships no type stubs.
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true
