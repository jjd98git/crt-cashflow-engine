# ---------------------------------------------------------------------------
# Modeling Assumptions (a)-(s) verbatim, PDF p136-137. These bind the tie-out.
# ---------------------------------------------------------------------------
modeling_assumptions:
  scope:
    value: apply to the Weighted Average Life Tables, Declining Balances Tables, Credit Event Sensitivity Tables, Cumulative Note Write-down Amount Tables and Yield Tables
    page: 136
    section: Prepayment and Yield Considerations - Assumptions Relating to Weighted Average Life Tables, Declining Balances Tables, Credit Event Sensitivity Tables, Cumulative Note Write-down Amount Tables and Yield Tables
    quote: |
      The tables on the following pages have been prepared on the basis of the following Modeling Assumptions:
  a_reference_obligations:
    value: Appendix C assumed loan groups
    page: 136
    section: Modeling Assumption (a)
    quote: |
      (a) The Reference Obligations consist of the assumed mortgage loans having the characteristics shown in Appendix C;
  b_balances_and_coupons:
    value: Table 1 balances and coupons, including B-1H and B-2H
    page: 136
    section: Modeling Assumption (b)
    quote: |
      (b) the original Class Principal Balances for the Original Notes are as set forth or described in Table 1, the maximum Class Principal Balances or Notional Principal Amounts, as applicable, for the MACR Notes are as set forth or described in Table 1 and the Class Coupons for each of the Classes of Notes, the Class B-1H Reference Tranche and the Class B-2H Reference Tranche are as set forth or described in Table 1;
  c_level_pay_amortization:
    value: scheduled payment computed from outstanding balance, rate and remaining term (full amortization)
    page: 136
    section: Modeling Assumption (c)
    quote: |
      (c) the scheduled monthly payment for each Reference Obligation is based on its outstanding principal balance, per annum interest rate and remaining term to maturity so that it will fully amortize in amounts sufficient for the repayment thereof over its remaining term to maturity;
  d_credit_events:
    value: non-Declining-Balances tables - Credit Events at the CER, no recovery lag, Preliminary Principal Loss Amount = 25% of Credit Event Amount; Declining Balances Tables - no Credit Events
    page: 136
    section: Modeling Assumption (d)
    quote: |
      (d) (i) other than with respect to the Declining Balances Tables, the Reference Obligations experience Credit Events at the indicated CER percentages, there is no lag between the related Credit Event Amounts and the application of any related Recovery Principal, the Preliminary Principal Loss Amount is equal to 25% of the Credit Event Amount; and (ii) with respect to the Declining Balances Tables, the Reference Obligations do not experience any Credit Events;
  d_preliminary_principal_loss_pct_of_credit_event_amount:
    value: 25
    page: 136
    section: Modeling Assumption (d)(i)
    quote: |
      the Preliminary Principal Loss Amount is equal to 25% of the Credit Event Amount
  e_delinquency_test:
    value: Delinquency Test always satisfied
    page: 136
    section: Modeling Assumption (e)
    quote: |
      (e) the Delinquency Test is satisfied for each Payment Date;
  f_scheduled_payments:
    value: scheduled P&I received timely on the last day of each month beginning January 2026
    page: 136
    section: Modeling Assumption (f)
    quote: |
      (f) each monthly payment of scheduled principal and interest on the Reference Obligations is timely received on the last day of each month beginning in January 2026;
  g_full_prepayments:
    value: full prepayments with 30 days interest on the last day of each month beginning January 2026
    page: 136
    section: Modeling Assumption (g)
    quote: |
      (g) principal prepayments in full on the Reference Obligations are received, together with 30 days’ interest thereon, on the last day of each month beginning in January 2026;
  h_no_curtailments:
    value: no partial prepayments
    page: 136
    section: Modeling Assumption (h)
    quote: |
      (h) there are no partial principal prepayments on the Reference Obligations;
  i_cpr:
    value: prepay at the indicated CPR
    page: 136
    section: Modeling Assumption (i)
    quote: |
      (i) the Reference Obligations prepay at the indicated CPR percentages;
  j_no_removals:
    value: no removals, reinstatements or substitutions
    page: 136
    section: Modeling Assumption (j)
    quote: |
      (j) no Reference Obligations are purchased or removed from, or reinstated to, the Reference Pool and no mortgage loans are substituted for the Reference Obligations included in the Reference Pool on the Closing Date;
  k_modification_events:
    value: Declining Balances and Credit Event Sensitivity Tables - no Modification Events; WAL, Cumulative Note Write-down and Yield Tables with RM > 0 - RM applied to all loans from the first day of the first month of the first Reporting Period through the Scheduled Maturity Date; March 2026 Modification Loss Amount = Jan 1, 2026 calc on Cut-off UPB + Feb 1, 2026 calc on Jan 31, 2026 UPB
    page: 136
    section: Modeling Assumption (k) (continues p137)
    quote: |
      (k) (i) with respect to the Declining Balances Tables and the Credit Event Sensitivity Tables, the Reference Obligations do not experience Modification Events; and (ii) with respect to the Weighted Average Life Tables, the Cumulative Note Write-down Amount Tables and the Yield Tables that have RM percentages greater than zero: (x) all Modification Events are effective as of the first day of the first month corresponding to the Reporting Period for all principal collections, other than full prepayments, for the first Payment Date and continue through the Scheduled Maturity Date; (y) RM are applied to all Reference Obligations at the indicated RM percentages; and (z) Modification Loss Amounts for the Payment Date in March 2026 will be the sum of (I) the Modification Loss Amounts calculated as of January 1, 2026 based on the UPB of the Reference Obligations as of the Cut-off Date and (II) the Modification Loss Amounts calculated as of February 1, 2026 based on the UPB of the Reference Obligations as of January 31, 2026;
  l_no_data_corrections:
    value: no data corrections
    page: 137
    section: Modeling Assumption (l)
    quote: |
      (l) there are no data corrections in connection with the Reference Obligations;
  m_early_redemption:
    value: no early redemption unless a table specifies it; if so, on the earlier of the February 2031 Payment Date and the first Payment Date on which aggregate UPB <= 10% of Cut-off Date Balance
    page: 137
    section: Modeling Assumption (m)
    quote: |
      (m) there is no early redemption (except as specified in the tables, occurring, if applicable, on the earlier of: (i) the Payment Date occurring in February 2031 and (ii) the first Payment Date in which the aggregate UPB of the Reference Obligations is less than or equal to 10% of the Cut-off Date Balance of the Reference Pool, otherwise no early redemption occurs);
  n_no_reversals_gains_settlements:
    value: no Reversed Credit Event Reference Obligations, Modification Gain Amounts or Rep and Warranty/Servicing Breach Settlement Amounts
    page: 137
    section: Modeling Assumption (n)
    quote: |
      (n) there are no Reversed Credit Event Reference Obligations, Modification Gain Amounts or Origination Rep and Warranty/Servicing Breach Settlement Amounts;
  o_projected_recovery_zero:
    value: Projected Recovery Amount = 0
    page: 137
    section: Modeling Assumption (o)
    quote: |
      (o) the Projected Recovery Amount is equal to zero;
  p_issue_date:
    value: 2026-02-17
    page: 137
    section: Modeling Assumption (p)
    quote: |
      (p) the Original Notes are issued on February 17, 2026;
  q_note_payment_dates:
    value: cash payments on the 25th of each month beginning March 2026
    page: 137
    section: Modeling Assumption (q)
    quote: |
      (q) cash payments on the Notes are received on the 25th day of each month beginning in March 2026 as described under “Description of The Notes”;
  r_sofr_flat_pct:
    value: 3.65786
    page: 137
    section: Modeling Assumption (r)
    quote: |
      (r) the SOFR Rate is assumed to remain constant at 3.65786% per annum; and
  s_no_exchanges_no_retirement:
    value: every Class outstanding from Closing to retirement, no exchanges, no Freddie Mac retirement of Notes
    page: 137
    section: Modeling Assumption (s)
    quote: |
      (s) each Class of Notes is outstanding from the Closing Date to retirement, no exchanges occur and Freddie Mac does not exercise its option to cause any Notes it owns to be retired by the Trust.
  pricing_speed_cpr_pct:
    value: 10
    page: 11
    section: Table 1 footnote (1)
    quote: |
      prepayments occur at the Pricing Speed of 10% CPR, calculated from the Closing Date
  cer_monthly_convention:
    value: constant monthly rate on then-outstanding balance; the annual-to-monthly conversion formula is not stated (CPR is stated to be converted to an equivalent monthly rate)
    page: 138
    section: Prepayment and Yield Considerations - Weighted Average Lives of the Notes
    quote: |
      The Weighted Average Life Tables, Credit Event Sensitivity Tables, Cumulative Note Write-down Amount Tables and Yield Tables below assume a constant rate of Reference Obligations becoming Credit Event Reference Obligations each month relative to the then-outstanding aggregate principal balance of the Reference Obligations.
  wal_definition:
    value: average time from issuance until the balance is reduced to zero; IO classes treat notional reductions as principal reductions
    page: 219
    section: Glossary - WAL
    quote: |
      “WAL” or “Weighted Average Life” with respect to any Class of Notes (other than the Classes of Interest Only MACR Notes), means the average amount of time that will elapse from the date of issuance of such Class of Notes until its balance is reduced to zero. With respect to any Class of Interest Only MACR Notes, we have calculated the Weighted Average Life assuming that a reduction in the Notional Principal Amount of such Class is a reduction in Class Principal Balance.

