      “MACR Notes” means interests in the Exchangeable Notes represented by the modifiable and combinable STACR Notes identified on Table 2 to the Memorandum, i.e., the Class M-2, Class M-2R, Class M-2S, Class M-2T, Class M-2U, Class M-2I, Class M-2AR, Class M-2AS, Class M-2AT, Class M-2AU, Class M-2AI, Class M-2BR, Class M-2BS, Class M-2BT, Class M-2BU, Class M-2BI, Class M-2RB, Class M-2SB, Class M-2TB and Class M-2UB Notes.
