    value: [M-2, M-2R, M-2S, M-2T, M-2U, M-2I, M-2AR, M-2AS, M-2AT, M-2AU, M-2AI, M-2BR, M-2BS, M-2BT, M-2BU, M-2BI, M-2RB, M-2SB, M-2TB, M-2UB, B-1, B-1R, B-1S, B-1T, B-1U, B-1I, B-1AR, B-1AI]
    page: 210
    section: Glossary - MACR Notes
    quote: |
      "MACR Notes" means interests in the Exchangeable Notes represented by the modifiable and combinable STACR Notes identified on Table 2 to the Memorandum, i.e., the Class M-2, Class M-2R, Class M-2S, Class M-2T, Class M-2U, Class M-2I, Class M-2AR, Class M-2AS, Class M-2AT, Class M-2AU, Class M-2AI, Class M-2BR, Class M-2BS, Class M-2BT, Class M-2BU, Class M-2BI, Class M-2RB, Class M-2SB, Class M-2TB, Class M-2UB, Class B-1, Class B-1R, Class B-1S, Class B-1T, Class B-1U, Class B-1I, Class B-1AR and Class B-1AI Notes.
    note: 28 MACR classes (DNA1 had 20). The B-1 family (8 classes) is NEW; there is no B-1B-only MACR class.
  deemed_exchange_at_closing:
    value: M-2A and M-2B deemed exchanged in whole or in part for M-2 (Combination 1) and B-1A and B-1B for B-1 (Combination 18) on the Closing Date
    page: 1
    section: front page footnotes (4) and (5)
    quote: |
      (4) The Class M-2A and Class M-2B Notes may be exchanged for the Class M-2 Notes, and vice versa, pursuant to Combination 1 described in Table 2. On the Closing Date, the Class M-2A and Class M-2B Notes will be deemed to have been exchanged in whole or in part, as applicable, for the Class M-2 Notes. The original Class Principal Balance shown for the Class M-2 Notes above is its Maximum Class Principal Balance. (5) The Class B-1A and Class B-1B Notes may be exchanged for the Class B-1 Notes, and vice versa, pursuant to Combination 18 described in Table 2. On the Closing Date, the Class B-1A and Class B-1B Notes will be deemed to have been exchanged in whole or in part, as applicable, for the Class B-1 Notes. The original Class Principal Balance shown for the Class B-1 Notes above is its Maximum Class Principal Balance.
  exchange_proportions_basis:
    value: constant proportions of ORIGINAL Class Principal Balances / Notional Principal Amounts
    page: 111
    section: MACR Notes - Exchanges
    quote: |
      We base "exchange proportions" on the original, rather than on the outstanding, Class Principal Balance or Notional Principal Amount of the Classes.
  exchange_constraints:
    value: aggregate Class Principal Balance and aggregate annual interest amount of Notes received must equal those surrendered (IO notional counts as $0 principal) at all SOFR levels
    page: 111
    section: MACR Notes - Exchanges
    quote: |
      The aggregate Class Principal Balance (rounded to whole dollars) of the Notes received in the exchange, immediately after the exchange, must equal that of the Notes surrendered for exchange immediately before the exchange (for this purpose, the Notional Principal Amount of any Interest Only MACR Note always equals $0). The aggregate "annual interest amount" (rounded to whole dollars) of the Notes received in the exchange must equal that of the Notes surrendered for exchange. The annual interest amount for any Note equals its outstanding Class Principal Balance or Notional Principal Amount times its Class Coupon. The annual interest amount for the Classes received and the Classes surrendered must be equal at all levels of the SOFR Rate.
  exchange_fee_usd:
