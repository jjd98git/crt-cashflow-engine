    section: Table 1 footnote (9)
    quote: |
      The Class Coupon for each of the Class M-2RB Notes, Class M-2SB Notes, Class M-2TB Notes and Class M-2UB Notes with respect to any Payment Date and the related Accrual Period will be a per annum rate equal to the product of (i) a fraction, the numerator of which is the aggregate Interest Payment Amount from the portions of the Class M-2B Notes and Class M-2AI Notes that were exchanged for such Class M-2RB Notes, Class M-2SB Notes, Class M-2TB Notes or Class M-2UB Notes, as applicable, and the denominator of which is (a) for so long as the Class Principal Balance of the Class M-2B Notes is greater than zero, the outstanding Class Principal Balance immediately prior to such Payment Date of such Class M-2RB Notes, Class M-2SB Notes, Class M-2TB Notes or Class M-2UB Notes, as applicable, or (b) for so long as the Class Principal Balance of the Class M-2B Notes is zero and the Notional Principal Amount of the Class M-2AI Notes is greater than zero, the outstanding Notional Principal Amount immediately prior to such Payment Date of the portions of the Class M-2AI Notes that were exchanged for such Class M-2RB Notes, Class M-2SB Notes, Class M-2TB Notes or Class M-2UB Notes, as applicable, and (ii) a fraction, the numerator of which is 360 and the denominator of which is the actual number of days in the related Accrual Period for such Class M-2RB Notes, Class M-2SB Notes, Class M-2TB Notes or Class M-2UB Notes, as applicable, for such Payment Date.
