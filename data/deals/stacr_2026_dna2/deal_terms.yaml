# STACR REMIC 2026-DNA2 - deal terms extracted from the Private Placement Memorandum.
#
# Source: data/raw/stacr-2026-dna2-ppm.txt (pdftotext -layout extract of the PPM dated
# March 13, 2026; Closing Date March 17, 2026). "page" is the PDF page of the extract = 1 +
# number of form-feed characters before the line (NOT the printed folio; printed folio =
# PDF page - 22 in the body, e.g. printed p.174 "Glossary" is PDF page 196; front matter
# Table 1 is PDF page 10 = printed x).
# Every leaf field is a mapping with keys value / page / section / quote. quote is verbatim
# PPM language (the extract uses straight ASCII quotation marks, reproduced as such). The
# optional key "note" carries the extractor remark and is never source text.
# Dollar amounts are strings so that consumers load them as Decimal, never float.
# Schema: identical key set to data/deal_terms/stacr_2026_dna1.yaml, section by section.
# Where DNA1 has a term this PPM lacks, the key is kept with value: null and a note quoting
# the nearest language. Where this PPM has a term DNA1 lacks, the key is added under the
# matching section and marked "NEW vs DNA1" in its note.
# Layout warning: pages 10 (Table 1), 24 (Table 3), 229 (Appendix A summary) and 264
# (Appendix C) are column-shifted by one row in the text extract. Every number taken from
# those pages was reconciled arithmetically (footnotes, Table 2, SOFR + margin, the
# Cut-off Date Balance). See data/deals/stacr_2026_dna2/open-questions.md DNA2-Q1.
# Extracted by ppm-analyst, 2026-09-08. Register: data/deals/stacr_2026_dna2/register_rows.csv
# rows DNA2-P1 onward.

