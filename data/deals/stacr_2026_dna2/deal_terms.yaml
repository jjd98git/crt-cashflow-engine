      the Class M-1H Reference Tranche will represent no less than 5% of the combined initial Class Notional Amount of the Class M-1 and Class M-1H Reference Tranches, the Class M-2AH Reference Tranche will represent no less than 5% of the combined initial Class Notional Amount of the Class M-2A and Class M-2AH Reference Tranches, the Class M-2BH Reference Tranche will represent no less than 5% of the combined initial Class Notional Amount of the Class M-2B and Class M-2BH Reference Tranches, the Class B-1AH Reference Tranche will represent no less than 5% of the combined initial Class Notional Amount of the Class B-1A and Class B-1AH Reference Tranches, and the Class B-1BH Reference Tranche will represent no less than 5% of the combined initial Class Notional Amount of the Class B-1B and Class B-1BH Reference Tranches.
    note: Verified - H shares are 5.0322% (M-1H), 5.0489% (M-2AH, M-2BH), 5.0186% (B-1AH, B-1BH).
  class_notional_amount_definition:
    value: initial amount minus Senior/Subordinate/Supplemental Reduction Amounts, minus Tranche Write-down Amounts, minus Notes Retirement Amounts, plus Tranche Write-up Amounts, plus (A-H only) Supplemental Senior Increase Amounts, plus (H tranches) Notes Retirement Amounts of the paired Note tranche
    page: 199
    section: Glossary - Class Notional Amount
    quote: |
      "Class Notional Amount" with respect to each Class of Reference Tranche as of any Payment Date, means the notional principal amount on such Payment Date which amount will equal the initial Class Notional Amount of such Class of Reference Tranche, minus the aggregate amount of Senior Reduction Amounts and/or Subordinate Reduction Amounts and Supplemental Reduction Amounts allocated to such Class of Reference Tranche on such Payment Date and all prior Payment Dates, minus the aggregate amount of Tranche Write-down Amounts allocated to reduce the Class Notional Amount of such Class of Reference Tranche on such Payment Date and on all prior Payment Dates, minus the aggregate amount of Notes Retirement Amounts paid, if any, by the Trust to Freddie Mac to retire any portion of the Corresponding Class of Notes on such Payment Date and on all dates prior to such Payment Date, plus the aggregate amount of Tranche Write-up Amounts allocated to increase the Class Notional Amount of such Class of Reference Tranche on such Payment Date and on all prior Payment Dates, plus, with respect to the Class A-H Reference Tranche, the aggregate amount of Supplemental Senior Increase Amounts allocated to increase the Class Notional Amount thereof on such Payment Date and on all prior Payment Dates, and plus, in the case of each of the Class M-1H, Class M-2AH, Class M-2BH, Class B-1AH and Class B-1BH Reference Tranches, the aggregate amount of Notes Retirement Amounts allocated to reduce the Class Notional Amount of the Class M-1, Class M-2A, Class M-2B, Class B-1A and Class B-1B Reference Tranches, respectively. For the avoidance of doubt, no Tranche Write-up Amount or Tranche Write-down Amount will be applied twice on the same Payment Date.

