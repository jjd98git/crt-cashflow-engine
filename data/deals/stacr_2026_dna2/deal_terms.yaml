  macr_principal_and_write_down_pass_through:
    value: principal, write-downs and write-ups on exchanged Exchangeable Notes flow to the MACR Notes in the exchange proportions
    page: 104
    section: Description of the Notes - Principal; Reductions in Class Principal Balances of the Notes Due to Allocation of Tranche Write-down Amounts
