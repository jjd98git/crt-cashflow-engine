    page: 206
    section: Glossary - Exchangeable Notes
    quote: |
      "Exchangeable Notes" means the Classes of Original Notes that are modifiable and combinable with the MACR Notes and vice versa, i.e., the Class M-2A Notes, Class M-2B Notes, Class B-1A Notes and Class B-1B Notes.
    note: DIFFERENT vs DNA1 ([M-2A, M-2B]); B-1A and B-1B are NEW Exchangeable Notes.
