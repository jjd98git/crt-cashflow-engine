source:
  file: data/raw/stacr-2026-dna2-ppm.txt
  deal: STACR REMIC 2026-DNA2
  memorandum_date: March 13, 2026
  section: Prepayment and Yield Considerations - Assumptions Relating to Weighted Average Life Tables, Declining
    Balances Tables, Credit Event Sensitivity Tables, Cumulative Note Write-down Amount Tables and Yield Tables
  pages: 138-139
  preamble_verbatim: 'The tables on the following pages have been prepared on the basis of the following Modeling
    Assumptions:'
  transcribed_by: ppm-analyst
  note: Text is verbatim from the pdftotext -layout extract (cp1252), with line breaks and the page-break folio
    '116' collapsed to single spaces. Nothing paraphrased. Page numbers are PDF page numbers (1 + form feeds before
    the line); printed folio = PDF page - 22 in this region.
modeling_assumptions:
- id: a
  page: '138'
  text: (a) The Reference Obligations consist of the assumed mortgage loans having the characteristics shown in
    Appendix C;
- id: b
  page: '138'
  text: (b) the original Class Principal Balances for the Original Notes are as set forth or described in Table
    1, the maximum Class Principal Balances or Notional Principal Amounts, as applicable, for the MACR Notes are
    as set forth or described in Table 1 and the Class Coupons for each of the Classes of Notes and the Class B-2H
    Reference Tranche are as set forth or described in Table 1;
- id: c
  page: '138'
  text: (c) the scheduled monthly payment for each Reference Obligation is based on its outstanding principal balance,
    per annum interest rate and remaining term to maturity so that it will fully amortize in amounts sufficient
    for the repayment thereof over its remaining term to maturity;
- id: d
  page: '138'
  text: (d) (i) other than with respect to the Declining Balances Tables, the Reference Obligations experience Credit
    Events at the indicated CER percentages, there is no lag between the related Credit Event Amounts and the application
    of any related Recovery Principal, the Preliminary Principal Loss Amount is equal to 25% of the Credit Event
    Amount; and (ii) with respect to the Declining Balances Tables, the Reference Obligations do not experience
    any Credit Events;
- id: e
  page: '138'
  text: (e) the Delinquency Test is satisfied for each Payment Date;
- id: f
  page: '138'
  text: (f) each monthly payment of scheduled principal and interest on the Reference Obligations is timely received
    on the last day of each month beginning in February 2026;
- id: g
  page: '138'
  text: (g) principal prepayments in full on the Reference Obligations are received, together with 30 days' interest
    thereon, on the last day of each month beginning in February 2026;
- id: h
  page: '138'
  text: (h) there are no partial principal prepayments on the Reference Obligations;
- id: i
  page: '138'
  text: (i) the Reference Obligations prepay at the indicated CPR percentages;
- id: j
  page: '138'
  text: (j) no Reference Obligations are purchased or removed from, or reinstated to, the Reference Pool and no
    mortgage loans are substituted for the Reference Obligations included in the Reference Pool on the Closing Date;
- id: k
  page: 138-139
  text: '(k) (i) with respect to the Declining Balances Tables and the Credit Event Sensitivity Tables, the Reference
    Obligations do not experience Modification Events; and (ii) with respect to the Weighted Average Life Tables,
    the Cumulative Note Write-down Amount Tables and the Yield Tables that have RM percentages greater than zero:
    (x) all Modification Events are effective as of the first day of the first month corresponding to the Reporting
    Period for all principal collections, other than full prepayments, for the first Payment Date and continue through
    the Scheduled Maturity Date; (y) RM are applied to all Reference Obligations at the indicated RM percentages;
    and (z) Modification Loss Amounts for the Payment Date in April 2026 will be the sum of (I) the Modification
    Loss Amounts calculated as of February 1, 2026 based on the UPB of the Reference Obligations as of the Cut-off
    Date and (II) the Modification Loss Amounts calculated as of March 1, 2026 based on the UPB of the Reference
    Obligations as of February 28, 2026;'
- id: l
  page: '139'
  text: (l) there are no data corrections in connection with the Reference Obligations;
- id: m
  page: '139'
  text: '(m) there is no early redemption (except as specified in the tables, occurring, if applicable, on the earlier
    of: (i) the Payment Date occurring in March 2031 and (ii) the first Payment Date in which the aggregate UPB
    of the Reference Obligations is less than or equal to 10% of the Cut-off Date Balance of the Reference Pool,
    otherwise no early redemption occurs);'
- id: n
  page: '139'
  text: (n) there are no Reversed Credit Event Reference Obligations, Modification Gain Amounts or Origination Rep
    and Warranty/Servicing Breach Settlement Amounts;
- id: o
  page: '139'
  text: (o) the Projected Recovery Amount is equal to zero;
- id: p
  page: '139'
  text: (p) the Original Notes are issued on March 17, 2026;
- id: q
  page: '139'
  text: (q) cash payments on the Notes are received on the 25th day of each month beginning in April 2026 as described
    under "Description of The Notes";
- id: r
  page: '139'
  text: (r) the SOFR Rate is assumed to remain constant at 3.67223% per annum; and
- id: s
  page: '139'
  text: (s) each Class of Notes is outstanding from the Closing Date to retirement, no exchanges occur and Freddie
    Mac does not exercise its option to cause any Notes it owns to be retired by the Trust.
definitions_stated_with_the_tables:
- term: CPR
  page: '139'
  text: CPR assumes that the outstanding principal balance of a pool of mortgage loans prepays at a specified constant
    annual rate. In projecting monthly cashflows, this rate is converted to an equivalent monthly rate.
- term: CER
  page: '140'
  text: The Weighted Average Life Tables, Credit Event Sensitivity Tables, Cumulative Note Write-down Amount Tables
    and Yield Tables below assume a constant rate of Reference Obligations becoming Credit Event Reference Obligations
    each month relative to the then-outstanding aggregate principal balance of the Reference Obligations. This assumed
    Credit Event Rate (or "CER") does not purport to be either a historical description of the default experience
    of the Reference Obligations or a prediction of the anticipated rate of defaults on the Reference Obligations.
    [...] A Credit Event Rate of 1% assumes Reference Obligations become Credit Event Reference Obligations at an
    annual rate of 1% which remains constant through the remaining lives of such Reference Obligations.
- term: RM
  page: '140'
  text: A Modification Event with a RM percentage of 2% assumes the gross coupon of the Reference Obligations is
    reduced by 2% and such Modification Event remains in effect through the remaining lives of such Reference Obligations.
- term: Weighted Average Life of Interest Only MACR Notes
  page: '139'
  text: We have calculated the Weighted Average Lives for each Class of Interest Only MACR Notes assuming that a
    reduction in its Notional Principal Amount is a reduction in Class Principal Balance.
