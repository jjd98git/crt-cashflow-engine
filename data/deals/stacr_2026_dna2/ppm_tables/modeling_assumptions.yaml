    cpr_pct: *id001
    periods: Closing Date, then March 25 of each year 2027 onward until the class is retired (table-specific; last
      label is 'March 25, 2043 and thereafter' for M-1, 'March 25, 2045 and thereafter' for the M-2A group, 'March
      25, 2046' otherwise), plus two WAL rows
  credit_events: no (assumption (d)(ii))
  preliminary_principal_loss_amount: not applicable - no Credit Events
  modification_events: no (assumption (k)(i))
  cer_pct: not applicable
  rm_pct: not applicable
  early_redemption: 'balance percentages: none assumed (balances continue past March 2031 in the 0% and 5% CPR columns);
    WAL rows: one ''to Scheduled Maturity Date'' (none) and one ''to Early Redemption Date**'' (** Based on the
    assumption that the Early Redemption Date occurs on the first eligible Payment Date)'
  sofr_rate_pct: 3.67223 constant (assumption (r))
  delinquency_test: satisfied on every Payment Date (assumption (e))
  footnotes:
  - Rounded to the nearest whole percentage. (p144; the dagger glyph attached to 'Percentages of Original Balances
    Outstanding' and to this footnote was not captured by the text extractor - the footnote line begins with a blank
    where the marker sits)
  - '** Based on the assumption that the Early Redemption Date occurs on the first eligible Payment Date. (p144-150)'
  - '* Based on Class Principal Balance. (p147, applies to M-2RB, M-2SB, M-2TB, M-2UB)'
  extraction_caveat: pdftotext printed the value block several lines below the date labels (and ran zero columns
    together, e.g. '500000'). Decoded by pairing the k-th value line with the k-th date label; validated by row
    count = label count, first row = 100 x 6, every CPR column non-increasing, run-together digit strings split
    uniquely into six whole-percent values, and the two WAL lines equalling the WAL tables' CER 0.00%/RM 0.00% row.
